    quote: "Data Retention\nInstance data, including configurations and workspace files, is retained while your account is active. After a billing suspension, we retain the affected instance data for fourteen days so we can restore it if Stripe confirms payment. After that period, we may delete the instance and its data. If you delete your account, we remove your instance data and personal information within 30 days, except where we must retain certain records longer, such as billing records kept for tax and accounting obligations."
